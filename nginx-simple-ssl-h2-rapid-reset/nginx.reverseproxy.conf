# Server block for HTTP
server {
    listen 80;
    server_name localhost;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

# Server block for HTTPS with HTTP/2 enabled
server {
    listen 443 ssl http2;
    server_name localhost;

    ssl_certificate /etc/ssl/certs/server.crt;
    ssl_certificate_key /etc/ssl/private/server.key;

    location / {
        # Reverse proxy everything to $SERVER_NA_NAME
        proxy_pass http://SERVER_NA_NAME;
    }
    # Increase the number of HTTP/2 concurrent streams
    http2_max_concurrent_streams 1000;  # Default is 128, setting this to a high value increases vulnerability

    # Keep alive requests set to a high value to allow more concurrent streams
    keepalive_requests 10000;  # Default is 1000, raising this makes the server vulnerable to the attack

    # Potentially unlimited connections from a single client

    
    limit_conn addr 65500;  # Setting this to 0 allows unlimited connections from a client

    # No rate limiting on requests, enabling rapid stream resets
    
}
limit_conn_zone $binary_remote_addr zone=addr:10m;
limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=999999r/s;  # This removes request rate limiting
