Experiment:
  name: exemplo_mentored_simples
  topology:
    links:
      - id: reactflow__edge-server-http-0-attacker-http-2
        source: server-http
        target: attacker-http
        interaction: network
      - id: reactflow__edge-server-http-0-client-http-1
        source: server-http
        target: client-http
        interaction: network
      - id: reactflow__edge-server-http-0-client-http-a-2
        source: server-http
        target: client-http-a
        interaction: network
      - id: reactflow__edge-server-http-0-client-http-b-3
        source: server-http
        target: client-http-b
        interaction: network
      - id: reactflow__edge-server-http-0-client-http-c-4
        source: server-http
        target: client-http-c
        interaction: network
      - id: reactflow__edge-server-http-0-vuln-ssh-node-1-6
        source: server-http
        target: vuln-ssh-node-1
        interaction: network
  nodeactors:
    - name: server-http
      replicas: 1
      persistent_volume_path:
        - /app/results/
        - /app/results/
      containers:
        - name: server
          image: >-
            ghcr.io/khalilsantana/generic-apache-flask-webserver:dataset-mentored-iot-2024-v1
          imagePullPolicy: Always
          securityContext:
            privileged: true
          ports:
            - containerPort: 80
          env:
            - name: ENABLE_SLOWLORIS_DEFENSE
              value: 'false'
        - name: tshark
          image: ghcr.io/khalilsantana/network-monitor:latest
          imagePullPolicy: Always
          command:
            - /entry.sh
          args:
            - cp /etc/hosts /app/results/hosts
          securityContext:
            privileged: true
          env:
            - name: SERVER_NA_NAME
              value: server-http
            - name: MENTORED_PRE_CMD
              value: iptables-80-22-tshark.sh
      region: ufpe-master-vm1
    - name: client-http
      replicas: 1
      containers:
        - name: client-static
          image: ghcr.io/khalilsantana/generic-client:latest
          imagePullPolicy: Always
          command:
            - /entry.sh
          args:
            - random-requests.sh
          env:
            - name: SERVER_NA_NAME
              value: server-http
            - name: TIME_WAIT_START
              value: '0'
            - name: TIMEOUT_CMD
              value: '300'
            - name: ADD_SERVER_IP_TO_COMMAND
              value: 'true'
            - name: MIN_RANDOM
              value: '1.0'
            - name: MAX_RANDOM
              value: '1.0'
            - name: ADDITIONAL_FLAGS
              value: '--static_behavior'
          securityContext:
            privileged: true
      region: ufpe-master-vm1
